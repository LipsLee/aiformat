<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>贴正 Pastify — AI回答一键格式化</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:#e8e5e0;color:#1a1a1a;
  display:flex;flex-direction:column;overflow:hidden;
}
#topbar{
  display:flex;align-items:center;justify-content:space-between;
  height:40px;padding:0 16px;background:#fff;
  border-bottom:1px solid #ddd;flex-shrink:0;z-index:10;
}
#topbar .logo{font-size:15px;font-weight:700;letter-spacing:-.3px}
#topbar .acts{display:flex;align-items:center;gap:10px}
#topbar button{
  font-size:12px;padding:4px 12px;border:1px solid #ddd;border-radius:5px;
  background:#fff;cursor:pointer;font-family:inherit;
}
#topbar button:hover{background:#f4f3f0}
#topbar .tgl{display:flex;align-items:center;gap:4px;font-size:12px;color:#777;cursor:pointer;user-select:none}
#topbar .tgl input{accent-color:#2563eb;margin:0}
#main{display:flex;flex:1;min-height:0}
#left{
  width:50%;display:flex;flex-direction:column;
  background:#fafaf8;border-right:1px solid #ddd;position:relative;
}
#inputArea{
  flex:1;width:100%;padding:20px 20px 52px;border:none;resize:none;outline:none;
  font-family:"SF Mono","Cascadia Code",Consolas,monospace;
  font-size:14px;line-height:1.7;color:#222;background:none;
}
#inputArea::placeholder{color:#c5bfb8}
.exe-bar{
  position:absolute;bottom:0;left:0;right:0;padding:8px 16px;
  background:#fafaf8;border-top:1px solid #eee;display:flex;align-items:center;gap:8px;
}
#btnExec{font-size:13px;font-weight:600;padding:7px 24px;border:none;border-radius:6px;cursor:pointer;font-family:inherit;background:#1a1a1a;color:#fff}
#btnExec:hover{background:#333}
.deep-btn{font-size:13px;font-weight:600;padding:7px 16px;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-family:inherit;background:#fff;color:#555}
.deep-btn:hover{background:#f5f4f1;border-color:#bbb}
.deep-btn.loading{color:#999;pointer-events:none}
.exe-bar .kb{font-size:10px;color:#aaa;margin-left:4px}
#right{width:50%;display:flex;flex-direction:column;background:#ddd8d1;overflow:hidden}
#stylebar{
  display:flex;align-items:center;gap:12px;
  height:38px;padding:0 14px;background:#fff;
  border-bottom:1px solid #e0ddd7;flex-shrink:0;
}
#stylebar select{
  font-size:12px;padding:4px 24px 4px 8px;border:1px solid #ddd;border-radius:5px;
  background:#fafaf8;font-family:inherit;cursor:pointer;
  appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='8' height='5' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0l4 5 4-5z' fill='%23999'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 8px center;
}
#stylebar .grp{display:flex;align-items:center;gap:4px;font-size:11px;color:#999}
#stylebar .grp input[type=range]{width:52px;height:3px;accent-color:#1a1a1a;cursor:pointer}
#stylebar .grp .v{font-size:11px;color:#555;min-width:14px}
#stage{flex:1;overflow:auto;padding:32px;display:flex;justify-content:center}
#preview{
  width:100%;max-width:760px;background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  padding:48px 56px;align-self:flex-start;
}
#preview .hint{color:#c5bfb8;text-align:center;padding:100px 0;line-height:1.8}
#floatbar{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  display:flex;gap:0;padding:4px;width:320px;
  background:#1a1a1a;border-radius:10px;
  box-shadow:0 4px 20px rgba(0,0,0,.25);
  z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;
}
#floatbar.on{opacity:1;pointer-events:auto}
#floatbar button{
  flex:1;font-size:13px;font-weight:500;padding:8px 0;
  border-radius:7px;cursor:pointer;font-family:inherit;border:none;
  text-align:center;margin:0 1px;
}
#floatbar .pri{background:#fff;color:#1a1a1a}
#floatbar .pri:hover{background:#e8e8e8}
#floatbar button:not(.pri){background:transparent;color:#aaa}
#floatbar button:not(.pri):hover{color:#fff}
#toast{
  position:fixed;bottom:72px;left:50%;transform:translateX(-50%);
  padding:8px 18px;background:#1a1a1a;color:#fff;
  border-radius:7px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;
}
#toast.on{opacity:1}
@media print{
  html,body{overflow:visible!important;height:auto!important;background:#fff!important}
  #topbar,#left,#stylebar,#floatbar,#toast{display:none!important}
  #main{display:block!important;overflow:visible!important}
  #right{width:100%!important;background:#fff!important;overflow:visible!important}
  #stage{overflow:visible!important;padding:0!important;display:block!important}
  #preview{max-width:100%!important;box-shadow:none!important;padding:0!important}
}
@media(max-width:768px){
  #main{flex-direction:column}
  #left,#right{width:100%;height:50%}
  #preview{padding:32px 24px}
}
</style>
</head>
<body>

<div id="topbar">
  <span class="logo">贴正 Pastify</span>
  <div class="acts">
    <label class="tgl"><input type="checkbox" id="chkClean" />清除AI用语</label>
    <button id="btnSample">示例</button>
    <button id="btnClear">清空</button>
  </div>
</div>

<div id="main">
  <div id="left">
    <textarea id="inputArea" placeholder="粘贴 AI 回答到这里..."></textarea>
    <div class="exe-bar">
      <button id="btnExec">执行</button>
      <button id="btnDeep" class="deep-btn">深度更正</button>
      <span class="kb">Ctrl+Enter</span>
    </div>
  </div>
  <div id="right">
    <div id="stylebar">
      <select id="fontFamily">
        <option value="'Noto Serif SC','Songti SC',serif">宋体</option>
        <option value="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">黑体</option>
        <option value="'KaiTi','STKaiti',serif">楷体</option>
      </select>
      <label class="grp">字号<input type="range" id="fontSize" min="12" max="24" value="16" /><span class="v" id="fontSizeVal">16</span></label>
      <label class="grp">行距<input type="range" id="lineHeight" min="1.4" max="2.6" step="0.1" value="1.8" /><span class="v" id="lineHeightVal">1.8</span></label>
      <label class="grp">段距<input type="range" id="paraSpacing" min="0" max="24" value="8" /><span class="v" id="paraSpacingVal">8</span></label>
    </div>
    <div id="stage">
      <div id="preview"><span class="hint">在左侧粘贴 AI 回答<br/>点击「执行」开始格式化</span></div>
    </div>
  </div>
</div>

<div id="floatbar">
  <button id="btnCopy" class="pri">复制格式</button>
  <button id="btnCopyPlain">纯文本</button>
  <button id="btnDocx">docx</button>
  <button id="btnPdf">PDF</button>
</div>

<div id="toast"></div>

<script type="module">
import { parseMarkdown } from './src/parser.ts'
import { cleanAIPhrases } from './src/cleaner.ts'
import { getStyleConfig } from './src/style.ts'
import { copyRichText, copyPlainText, downloadDocx } from './src/export.ts'
import { deepCorrect } from './src/deepfix.ts'

var $=id=>document.getElementById(id)
var inputArea=$('inputArea'),previewArea=$('preview'),floatBar=$('floatbar')
var chkClean=$('chkClean'),toastEl=$('toast'),currentHtml=''

// ===== APP =====
function toast(m){ toastEl.textContent=m;toastEl.classList.add('on');setTimeout(function(){ toastEl.classList.remove('on') },1800) }

function renderMathAndDiagrams(){
  if (window.renderMathInElement) {
    try {
      window.renderMathInElement(previewArea, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false},
          {left: '\\[', right: '\\]', display: true},
        ],
        throwOnError: false
      })
    } catch(e) {}
  }
  if (window.mermaid) {
    try {
      window.mermaid.run({ querySelector: '.doc .mermaid' }).catch(function(){})
    } catch(e) {}
  }
}

async function doFormat(){
  var raw=inputArea.value
  if (!raw.trim()) {
    previewArea.innerHTML='<span class="hint">在左侧粘贴 AI 回答<br/>点击「执行」开始格式化</span>'
    currentHtml='';floatBar.classList.remove('on');return
  }
  var src=chkClean.checked ? cleanAIPhrases(raw) : raw
  currentHtml=parseMarkdown(src,getStyleConfig())
  previewArea.innerHTML=currentHtml
  renderMathAndDiagrams()
  floatBar.classList.add('on')
}

async function doDeepFix(){
  if(!currentHtml) return toast('请先粘贴内容并点执行')
  var btn=$('btnDeep')
  btn.textContent='正在扫描...'
  btn.classList.add('loading')
  await new Promise(function(r){ setTimeout(r, 50) }) // let UI update

  var docEl = previewArea.querySelector('.doc')
  if(!docEl) { btn.textContent='深度更正'; btn.classList.remove('loading'); return }

  var count = await deepCorrect(docEl)

  // Update currentHtml from the fixed DOM
  currentHtml = previewArea.innerHTML

  if(count>0){
    btn.textContent='深度更正'
    btn.classList.remove('loading')
    toast('已修正 '+count+' 处未渲染的公式')
  } else {
    btn.textContent='深度更正'
    btn.classList.remove('loading')
    toast('未发现需要修正的内容')
  }
}

$('btnExec').addEventListener('click',doFormat)
$('btnDeep').addEventListener('click',doDeepFix)
inputArea.addEventListener('keydown',function(e){ if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();doFormat()} })
$('btnSample').addEventListener('click',function(){ inputArea.value=SAMPLE; doFormat() })
$('btnClear').addEventListener('click',function(){
  inputArea.value=''
  previewArea.innerHTML='<span class="hint">在左侧粘贴 AI 回答<br/>点击「执行」开始格式化</span>'
  currentHtml='';floatBar.classList.remove('on')
})
chkClean.addEventListener('change',function(){ if(currentHtml) doFormat() })

$('btnCopy').addEventListener('click',function(){
  if(!currentHtml) return toast('请先粘贴内容并点执行')
  copyRichText(currentHtml);toast('已复制，可粘贴到 Word / 飞书 / 微信')
})
$('btnCopyPlain').addEventListener('click',function(){
  var t=previewArea.textContent&&previewArea.textContent.trim()
  if(!t) return toast('请先粘贴内容并点执行')
  copyPlainText(t);toast('已复制纯文本')
})
$('btnDocx').addEventListener('click',function(){
  if(!currentHtml) return toast('请先粘贴内容并点执行')
  downloadDocx(currentHtml,'贴正Pastify-输出.docx');toast('DOCX 下载中...')
})
$('btnPdf').addEventListener('click',function(){
  if(!currentHtml) return toast('请先粘贴内容并点执行')
  window.print()
});

['fontSize','lineHeight','paraSpacing'].forEach(function(id){
  $(id).addEventListener('input',function(){
    var el=document.getElementById(id+'Val');if(el) el.textContent=$(id).value
    if(currentHtml) doFormat()
  })
})
$('fontFamily').addEventListener('change',function(){ if(currentHtml) doFormat() })

var SAMPLE = [
  '# 多平台AI格式兼容性展示',
  '',
  '支持 **ChatGPT / Claude / DeepSeek / 豆包 / Gemini** 等所有主流AI平台。',
  '',
  '## 多平台公式测试',
  '',
  '标准LaTeX（ChatGPT/Claude）：行内 $E=mc^2$，块级 $$\\sum_{n=1}^{\\infty} \\frac{1}{n^2} = \\frac{\\pi^2}{6}$$',
  '',
  '圆括号LaTeX（部分AI平台）：行内 \\(\\alpha + \\beta = \\gamma\\)，块级 \\[\\oint_C \\mathbf{F} \\cdot d\\mathbf{r}\\]',
  '',
  '## 微积分',
  '',
  '定积分分部积分公式：',
  '',
  '$$\\int_{a}^{b} u(x)v\'(x)dx = u(x)v(x)\\bigg|_{a}^{b} - \\int_{a}^{b} v(x)u\'(x)dx$$',
  '',
  '## 数学公式',
  '',
  '欧拉恒等式：$e^{i\\pi} + 1 = 0$',
  '贝叶斯公式：$P(A|B) = \\frac{P(B|A)P(A)}{P(B)}$',
  '高斯积分：$$\\int_{-\\infty}^{\\infty} e^{-x^2} dx = \\sqrt{\\pi}$$',
  '',
  '## 物理公式',
  '',
  '牛顿引力：$$F = G\\frac{m_1 m_2}{r^2}$$',
  '麦克斯韦：$$\\nabla \\times \\mathbf{E} = -\\frac{\\partial \\mathbf{B}}{\\partial t}$$',
  '薛定谔方程：$$i\\hbar\\frac{\\partial}{\\partial t}\\Psi = \\hat{H}\\Psi$$',
  '',
  '## 化学方程式',
  '',
  '电离平衡：$$K_w = [\\text{H}^+][\\text{OH}^-] = 1.0 \\times 10^{-14}$$',
  '理想气体：$$PV = nRT$$',
  '能斯特方程：$$E = E^0 - \\frac{RT}{nF}\\ln Q$$',
  '',
  '## Mermaid 流程图',
  '',
  '```mermaid',
  'graph TD',
  '    A[开始] --> B{检查条件}',
  '    B -->|满足| C[执行任务]',
  '    B -->|不满足| D[返回重试]',
  '    C --> E[输出结果]',
  '    D --> B',
  '```',
  '',
  '## 代码示例',
  '',
  '```python',
  'def quick_sort(arr):',
  '    if len(arr) <= 1:',
  '        return arr',
  '    pivot = arr[0]',
  '    left = [x for x in arr[1:] if x < pivot]',
  '    right = [x for x in arr[1:] if x >= pivot]',
  '    return quick_sort(left) + [pivot] + quick_sort(right)',
  '```',
  '',
  '## 算法复杂度（表格内嵌公式）',
  '',
  '| 算法 | 时间 | 空间 |',
  '|------|------|------|',
  '| 快排 | $O(n\\log n)$ | $O(\\log n)$ |',
  '| 归并 | $O(n\\log n)$ | $O(n)$ |',
  '| Dijkstra | $O((V+E)\\log V)$ | $O(V)$ |',
  '',
  '> 贴正 Pastify 兼容所有 AI 平台的 Markdown 输出。执行后如仍有公式未渲染，点击「深度更正」即可修正。',
  '',
  '希望这对你有帮助！如还有其他问题，请随时告诉我。'
].join('\n')
</script>
</body>
</html>
